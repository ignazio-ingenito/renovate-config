name: Validate Renovate presets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate Renovate config
        run: npx --yes --package renovate@44.30.3 -- renovate-config-validator --no-global default.json automerge.json
