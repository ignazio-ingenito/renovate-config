name: Validate Renovate presets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('default.json','utf8')); JSON.parse(require('fs').readFileSync('automerge.json','utf8'))"
      - name: Validate Renovate config
        run: npx --yes renovate-config-validator default.json automerge.json
